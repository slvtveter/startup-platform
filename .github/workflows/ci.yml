name: CI

on:
  pull_request:
  push:
    branches: [main]

# На PR старый прогон отменяем. На main нет: иначе новый push оборвал бы выкатку на полпути.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Known vulnerabilities in runtime dependencies (KAN-103)
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit@2.9.0 -r /tmp/requirements.txt --disable-pip --no-deps
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - name: Migrations match models
        run: uv run alembic check
      - run: uv run pytest -q
      - name: Generated TS client is up to date
        run: |
          uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2))" > ../web/openapi.json
          git diff --exit-code ../web/openapi.json || (echo "::error::Run 'make gen-client' and commit the result" && exit 1)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in runtime dependencies (KAN-103)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e-shard:
    # Сквозные сценарии в настоящем браузере против поднятого docker compose.
    # Тесты делим на две параллельные джобы, у каждой свой стенд: так вдвое быстрее и без общих данных.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Зависимости Playwright ставим, пока поднимается стек.
      - name: npm ci (background)
        working-directory: apps/web
        run: (npm ci > /tmp/npm-ci.log 2>&1; echo $? > /tmp/npm-ci.exit) &
      - name: Start stack
        run: |
          cp infra/.env.example infra/.env
          # E2E регистрирует много пользователей с одного IP: лимит защиты здесь мешает.
          echo "AUTH_RATE_LIMIT=1000" >> infra/.env
          docker compose -f infra/docker-compose.yml up --build -d
          for i in $(seq 1 60); do curl -sf localhost:8080/api/health && break; sleep 3; done
          docker compose -f infra/docker-compose.yml exec -T api python -m app.scripts.seed
          # Прогреваем dev-сервер Next, чтобы первая компиляция не съела таймауты тестов.
          for p in / /startups /startups/vkusnoryadom /people /people/mariya-kim /register /login /me/profile /me/settings /admin /startups/new; do curl -s -o /dev/null localhost:8080$p; done
      - name: Wait for npm ci
        run: |
          until [ -f /tmp/npm-ci.exit ]; do sleep 1; done
          cat /tmp/npm-ci.log | tail -5
          exit "$(cat /tmp/npm-ci.exit)"
      - run: npx playwright test --shard=${{ matrix.shard }}/2
        working-directory: apps/web
      - name: Screenshots of key pages (KAN-86)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screens-${{ matrix.shard }}
          path: apps/web/test-results/screens
          retention-days: 14
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  # Обязательная проверка в защите main называется «e2e»: собираем итог шардов в одну джобу.
  e2e:
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = "success"

  images:
    # Собираем prod-образы и поднимаем их через compose.prod.yml с HTTPS: так проверяем, что деплой соберётся.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build images
        run: |
          docker build -t $REGISTRY-api:sha-${GITHUB_SHA::7} apps/api
          docker build --target prod -t $REGISTRY-web:sha-${GITHUB_SHA::7} apps/web
      - name: Smoke test production stack
        working-directory: infra
        run: |
          cat > .env.ci <<ENV
          STACK=ci
          SITE_DOMAIN=localhost
          ACME_EMAIL=ci@example.com
          REGISTRY=$REGISTRY
          IMAGE_TAG=sha-${GITHUB_SHA::7}
          POSTGRES_USER=app
          POSTGRES_PASSWORD=ci-password
          POSTGRES_DB=app
          SMTP_HOST=localhost
          MAIL_FROM=ci@example.com
          SECRET_KEY=ci-secret-not-for-prod
          ENV
          docker compose -f compose.prod.yml --env-file .env.ci up -d
          for i in $(seq 1 60); do curl -skf https://localhost/api/health && break; sleep 3; done
          curl -skf https://localhost/api/health | grep '"db":"ok"'
          # web стартует отдельно от api: ждём и его, иначе гонка на холодном старте.
          for i in $(seq 1 40); do curl -skf -o /dev/null https://localhost/ && break; sleep 3; done
          curl -skf https://localhost/ | grep -q "Тебя ждёт место в команде"
          curl -skf https://localhost/startups > /dev/null
          # OG-картинка рендерится в prod-образе: шрифты из assets/og-fonts попали в сборку.
          curl -skf -o /tmp/og.png https://localhost/startups/no-such-startup/opengraph-image
          file /tmp/og.png | grep -q "PNG image data, 1200 x 630"
          # api и worker работают не от root (KAN-102).
          test "$(docker compose -f compose.prod.yml --env-file .env.ci exec -T api id -u)" != "0"
          test "$(docker compose -f compose.prod.yml --env-file .env.ci exec -T worker id -u)" != "0"
          # Воркер фоновых задач запущен и не падает в цикле перезапусков.
          sleep 5
          test "$(docker compose -f compose.prod.yml --env-file .env.ci ps worker --format '{{.State}}')" = "running"
          docker compose -f compose.prod.yml --env-file .env.ci logs worker | grep -q "worker started"
          echo "production stack is healthy"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Browser check of prod build under CSP (KAN-95)
        working-directory: apps/web
        env:
          PROD_CHECK: "1"
          E2E_BASE_URL: https://localhost
        run: |
          npm ci
          npx playwright test e2e/prod-csp.spec.ts
      - name: Stack logs on failure
        if: failure()
        working-directory: infra
        run: docker compose -f compose.prod.yml --env-file .env.ci logs --tail=200
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for svc in api web; do
            docker tag $REGISTRY-$svc:sha-${GITHUB_SHA::7} $REGISTRY-$svc:main
            docker push $REGISTRY-$svc:sha-${GITHUB_SHA::7}
            docker push $REGISTRY-$svc:main
          done

  # Несколько PR смержили подряд — выкатываем только последний коммит main: он содержит все
  # изменения. Старые прогоны проверки проходят, но деплой пропускают.
  latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, e2e, images]
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api repos/${{ github.repository }}/commits/main -q .sha)
          echo "main=$head this=$GITHUB_SHA"
          echo "is_latest=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Merge в main = релиз в прод (docs/deploy.md): тот же образ, что прошёл проверки выше.
  deploy:
    if: needs.latest.outputs.is_latest == 'true'
    needs: [images, latest]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.images.outputs.tag }}
    secrets: inherit
