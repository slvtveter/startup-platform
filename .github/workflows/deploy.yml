name: Deploy

# Только вручную и только через GitHub Environment с обязательным подтверждением человеком.
# У агентов доступа к секретам сервера нет. Настройка: docs/deploy.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Куда деплоим"
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: "Тег образа (sha-xxxxxxx или main)"
        required: true
        default: main

concurrency:
  group: deploy-${{ inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload infra files
        run: |
          scp -r infra/compose.prod.yml infra/Caddyfile.prod infra/Caddyfile.staging infra/backup \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH || '/opt/startup-platform' }}/"
      - name: Pull and restart
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/startup-platform' }}
            export IMAGE_TAG=${{ inputs.image_tag }}
            docker compose -f compose.prod.yml --env-file .env.prod pull api web
            docker compose -f compose.prod.yml --env-file .env.prod up -d
            for i in \$(seq 1 40); do curl -sf -o /dev/null http://localhost:80 -H 'Host: x' || true; docker compose -f compose.prod.yml --env-file .env.prod ps api | grep -q healthy && exit 0; sleep 3; done
            docker compose -f compose.prod.yml --env-file .env.prod logs --tail=100 api
            exit 1"
