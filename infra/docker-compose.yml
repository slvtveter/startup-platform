name: startup-platform

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Владелец volume media — пользователь приложения (uid 10001), см. compose.prod.yml.
  media-init:
    build: ../apps/api
    user: root
    command: ["chown", "-R", "10001:10001", "/media"]
    volumes:
      - media:/media
    restart: "no"

  api:
    build: ../apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      SITE_URL: http://localhost:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MEDIA_DIR: /media
    command: sh -c "alembic upgrade head && fastapi dev app/main.py --host 0.0.0.0 --port 8000"
    volumes:
      - ../apps/api/app:/app/app
      - ../apps/api/alembic:/app/alembic
      - media:/media
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully


  # Фоновые задачи (KAN-91). Код не перезагружается сам: после правок — make restart-worker.
  worker:
    build: ../apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      SITE_URL: http://localhost:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    command: python -m app.worker
    volumes:
      - ../apps/api/app:/app/app
    depends_on:
      - api
  web:
    build:
      context: ../apps/web
      target: dev
    environment:
      # SSR-запросы Next идут к API напрямую внутри docker-сети.
      API_INTERNAL_URL: http://api:8000
      SITE_URL: http://localhost:8080
    volumes:
      - ../apps/web/src:/app/src
      - ../apps/web/public:/app/public
      - ../apps/web/assets:/app/assets
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
    depends_on:
      - api
      - web

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  pgdata:
  media:
