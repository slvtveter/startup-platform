# Production / staging: образы из GHCR, Caddy с автоматическим HTTPS (Let's Encrypt).
# Запуск на сервере: docker compose -f compose.prod.yml --env-file .env.prod up -d
name: startup-platform-${STACK:-prod}

# Общие ограничения для сервисов приложения (KAN-102).
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Владелец volume media — пользователь приложения (uid 10001), а не root (KAN-102).
  # Одноразовый шаг: без него порядок монтирования решал бы, кто владеет каталогом.
  media-init:
    image: ${REGISTRY:-ghcr.io/slvtveter/startup-platform}-api:${IMAGE_TAG:-main}
    user: root
    command: ["chown", "-R", "10001:10001", "/media"]
    volumes:
      - media:/media
    restart: "no"

  api:
    image: ${REGISTRY:-ghcr.io/slvtveter/startup-platform}-api:${IMAGE_TAG:-main}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 768m
    cpus: 1.0
    environment: &api-env
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SITE_URL: https://${SITE_DOMAIN}
      ALLOWED_ORIGINS: '["https://${SITE_DOMAIN}"]'
      EVENTS_SALT: ${EVENTS_SALT:-}
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env.prod (openssl rand -hex 32)}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM}
      MEDIA_DIR: /media
      # Вход через соцсети: пусто — кнопки скрыты (docs/deploy.md).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
    volumes:
      - media:/media
    # Миграции применяются при старте контейнера (CMD в Dockerfile).
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10


  # Фоновые задачи (KAN-91): письма из очереди jobs и ежечасные напоминания основателям.
  worker:
    image: ${REGISTRY:-ghcr.io/slvtveter/startup-platform}-api:${IMAGE_TAG:-main}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 384m
    cpus: 0.5
    environment: *api-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
  web:
    image: ${REGISTRY:-ghcr.io/slvtveter/startup-platform}-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    mem_limit: 768m
    cpus: 1.0
    environment:
      API_INTERNAL_URL: http://api:8000
      SITE_URL: https://${SITE_DOMAIN}
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./${CADDYFILE:-Caddyfile.prod}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
    depends_on:
      - api
      - web

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - media:/media:ro
    entrypoint: ["/bin/sh", "/scripts/loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  media:
